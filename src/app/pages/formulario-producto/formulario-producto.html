<div class="container mt-4">

  <h2>{{ esEdicion ? 'Editar producto' : 'Registrar producto' }}</h2>

  <p class="text-muted">
    Ingrese la información del equipo o herramienta.
  </p>

  <div class="row justify-content-center">
    <div class="col-md-7">

      <div class="card shadow-sm">

        <div class="card-header bg-primary text-white">
          Datos del producto
        </div>

        <div class="card-body">

          <form #formulario="ngForm"
                (ngSubmit)="guardarProducto()">

            <div class="mb-3">
              <label class="form-label">Nombre del producto</label>
              <input
                type="text"
                class="form-control"
                name="nombre"
                [(ngModel)]="producto.nombre"
                placeholder="Ingrese el nombre del producto"
                required>
            </div>

            <div class="mb-3">
              <label class="form-label">Categoría</label>
              <input
                type="text"
                class="form-control"
                name="categoria"
                [(ngModel)]="producto.categoria"
                placeholder="Ingrese la categoría"
                required>
            </div>

            <div class="mb-3">
              <label class="form-label">Precio ($)</label>
              <input
                type="number"
                class="form-control"
                name="precio"
                [(ngModel)]="producto.precio"
                min="0"
                step="0.01"
                required>
            </div>

            <div class="mb-3">
              <label class="form-label">Stock</label>
              <input
                type="number"
                class="form-control"
                name="stock"
                [(ngModel)]="producto.stock"
                min="0"
                step="1"
                required>
            </div>

            @if (mensajeError) {
              <div class="alert alert-danger">
                {{ mensajeError }}
              </div>
            }

            <div class="d-flex justify-content-end gap-2">

              <a routerLink="/admin" class="btn btn-secondary">
                Cancelar
              </a>

              <button
                type="submit"
                class="btn btn-success"
                [disabled]="formulario.invalid">
                {{ esEdicion ? 'Actualizar producto' : 'Guardar producto' }}
              </button>

            </div>

          </form>

        </div>
      </div>

    </div>
  </div>

</div>
